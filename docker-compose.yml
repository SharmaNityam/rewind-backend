version: '3.8'

services:
  postgres:
    image: postgres:13-alpine
    container_name: rewind-postgres
    environment:
      POSTGRES_USER: rewind_user
      POSTGRES_PASSWORD: rewind_password
      POSTGRES_DB: rewind_db
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/create-tables.sql:/docker-entrypoint-initdb.d/create-tables.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rewind_user -d rewind_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rewind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: rewind-backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://rewind_user:rewind_password@postgres:5432/rewind_db?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

