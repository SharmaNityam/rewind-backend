openapi: 3.0.3
info:
  title: Rewind Backend API
  description: |
    Backend API for the Rewind iOS mental health and wellness application.
    
    This API provides endpoints for:
    - User authentication and management
    - Journaling (text and voice entries)
    - Goal tracking
    - Care Corner (breathing exercises, meditation, challenges)
    - Community features (posts, comments, likes)
    - Notifications
    - Home Pets (Penguin companion integration)
    
    All endpoints (except health check) require JWT authentication via Bearer token in the Authorization header.
  version: 1.0.0
  contact:
    name: Rewind Backend Team
  license:
    name: ISC

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://api.rewind.app
    description: Production server

tags:
  - name: Health
    description: Health check endpoints
  - name: Authentication
    description: User authentication and authorization
  - name: Users
    description: User profile and onboarding management
  - name: Journals
    description: Journal entries (text and voice)
  - name: Goals
    description: Personal health and wellness goals
  - name: Care Corner
    description: Breathing exercises, meditation, and daily challenges
  - name: Community
    description: Community posts, comments, and interactions
  - name: Notifications
    description: User notifications
  - name: Home Pets
    description: Penguin companion pet management

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check if the server is running
      operationId: healthCheck
      responses:
        '200':
          description: Server is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Server is running
                  timestamp:
                    type: string
                    format: date-time

  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: Create a new user account with email or phone
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - password
              properties:
                name:
                  type: string
                  minLength: 1
                  example: John Doe
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                phone:
                  type: string
                  pattern: '^\+[1-9]\d{1,14}$'
                  example: +1234567890
                password:
                  type: string
                  minLength: 6
                  example: SecurePass123!
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticate user with email/phone and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                phone:
                  type: string
                  pattern: '^\+[1-9]\d{1,14}$'
                  example: +1234567890
                password:
                  type: string
                  example: SecurePass123!
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: Send OTP to user's email or phone for password reset
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  pattern: '^\+[1-9]\d{1,14}$'
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /api/v1/auth/verify-otp:
    post:
      tags:
        - Authentication
      summary: Verify OTP
      description: Verify OTP for password reset
      operationId: verifyOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - otp
              properties:
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  pattern: '^\+[1-9]\d{1,14}$'
                otp:
                  type: string
                  minLength: 4
                  maxLength: 8
      responses:
        '200':
          description: OTP verified
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password
      description: Reset password after OTP verification
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - otp
                - newPassword
              properties:
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  pattern: '^\+[1-9]\d{1,14}$'
                otp:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Password reset successful
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Invalidate refresh token
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful

  /api/v1/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Get authenticated user's information
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'

  /api/v1/users/profile:
    get:
      tags:
        - Users
      summary: Get user profile
      description: Get authenticated user's profile
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
    put:
      tags:
        - Users
      summary: Update user profile
      description: Update authenticated user's profile
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                location:
                  type: string
                dateOfBirth:
                  type: string
                  format: date
                gender:
                  type: string
                  enum: [male, female, prefer_not_to_say]
                age:
                  type: integer
                  minimum: 14
                  maximum: 99
                healthGoal:
                  type: string
                seekingProfessionalHelp:
                  type: boolean
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'

  /api/v1/users/profile/avatar:
    post:
      tags:
        - Users
      summary: Upload profile avatar
      description: Upload or update user's profile image
      operationId: updateProfileImage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      profileImageUrl:
                        type: string

  /api/v1/users/onboarding:
    post:
      tags:
        - Users
      summary: Save onboarding data
      description: Complete user onboarding
      operationId: saveOnboarding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - healthGoal
                - gender
                - age
                - seekingProfessionalHelp
              properties:
                healthGoal:
                  type: string
                gender:
                  type: string
                  enum: [male, female, prefer_not_to_say]
                age:
                  type: integer
                  minimum: 14
                  maximum: 99
                seekingProfessionalHelp:
                  type: boolean
      responses:
        '200':
          description: Onboarding completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'

  /api/v1/users/onboarding-status:
    get:
      tags:
        - Users
      summary: Get onboarding status
      description: Check if user has completed onboarding
      operationId: getOnboardingStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Onboarding status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      onboardingCompleted:
                        type: boolean

  /api/v1/journals:
    get:
      tags:
        - Journals
      summary: List journals
      description: Get paginated list of user's journal entries
      operationId: listJournals
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
        - name: entryType
          in: query
          schema:
            type: string
            enum: [text, voice]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: List of journals
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Journal'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
    post:
      tags:
        - Journals
      summary: Create journal entry
      description: Create a new journal entry (text or voice)
      operationId: createJournal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - content
                - entryType
              properties:
                title:
                  type: string
                content:
                  type: string
                entryType:
                  type: string
                  enum: [text, voice]
                voiceRecordingUrl:
                  type: string
                  format: uri
                transcriptionText:
                  type: string
                moodTags:
                  type: array
                  items:
                    type: string
                mediaUrls:
                  type: array
                  items:
                    type: string
                    format: uri
      responses:
        '201':
          description: Journal created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Journal'
                  penguinResponse:
                    $ref: '#/components/schemas/PenguinResponse'

  /api/v1/journals/timeline:
    get:
      tags:
        - Journals
      summary: Get journal timeline
      description: Get timeline view of journal entries
      operationId: getTimeline
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
        - name: entryType
          in: query
          schema:
            type: string
            enum: [text, voice]
      responses:
        '200':
          description: Timeline data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Journal'

  /api/v1/journals/voice/transcribe:
    post:
      tags:
        - Journals
      summary: Transcribe voice recording
      description: Upload and transcribe a voice recording
      operationId: transcribeVoice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
      responses:
        '200':
          description: Transcription result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      transcriptionText:
                        type: string

  /api/v1/journals/{id}:
    get:
      tags:
        - Journals
      summary: Get journal by ID
      description: Get a specific journal entry
      operationId: getJournal
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Journal entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Journal'
    put:
      tags:
        - Journals
      summary: Update journal entry
      description: Update an existing journal entry
      operationId: updateJournal
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
                moodTags:
                  type: array
                  items:
                    type: string
                transcriptionText:
                  type: string
      responses:
        '200':
          description: Journal updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Journal'
    delete:
      tags:
        - Journals
      summary: Delete journal entry
      description: Delete a journal entry
      operationId: deleteJournal
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Journal deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/journals/{id}/media:
    post:
      tags:
        - Journals
      summary: Upload media to journal
      description: Upload media files (images, videos) to a journal entry
      operationId: uploadJournalMedia
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                media:
                  type: string
                  format: binary
      responses:
        '200':
          description: Media uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      mediaUrls:
                        type: array
                        items:
                          type: string

  /api/v1/goals:
    get:
      tags:
        - Goals
      summary: List goals
      description: Get paginated list of user's goals
      operationId: listGoals
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, completed, paused, cancelled]
      responses:
        '200':
          description: List of goals
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Goal'
    post:
      tags:
        - Goals
      summary: Create goal
      description: Create a new goal
      operationId: createGoal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                description:
                  type: string
                category:
                  type: string
                targetDate:
                  type: string
                  format: date-time
                status:
                  type: string
                  enum: [active, completed, paused, cancelled]
                progress:
                  type: integer
                  minimum: 0
                  maximum: 100
      responses:
        '201':
          description: Goal created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Goal'

  /api/v1/goals/{id}:
    get:
      tags:
        - Goals
      summary: Get goal by ID
      description: Get a specific goal
      operationId: getGoal
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Goal details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Goal'
    put:
      tags:
        - Goals
      summary: Update goal
      description: Update an existing goal
      operationId: updateGoal
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                category:
                  type: string
                targetDate:
                  type: string
                  format: date-time
                status:
                  type: string
                  enum: [active, completed, paused, cancelled]
                progress:
                  type: integer
                  minimum: 0
                  maximum: 100
      responses:
        '200':
          description: Goal updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Goal'
    delete:
      tags:
        - Goals
      summary: Delete goal
      description: Delete a goal
      operationId: deleteGoal
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Goal deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/goals/{id}/progress:
    put:
      tags:
        - Goals
      summary: Update goal progress
      description: Update the progress percentage of a goal
      operationId: updateGoalProgress
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - progress
              properties:
                progress:
                  type: integer
                  minimum: 0
                  maximum: 100
      responses:
        '200':
          description: Progress updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Goal'

  /api/v1/care-corner/challenges:
    get:
      tags:
        - Care Corner
      summary: Get daily challenges
      description: Get daily challenges for the user
      operationId: getChallenges
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Daily challenges
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DailyChallenge'

  /api/v1/care-corner/challenges/{id}/complete:
    post:
      tags:
        - Care Corner
      summary: Complete challenge
      description: Mark a daily challenge as completed
      operationId: completeChallenge
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Challenge completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object

  /api/v1/care-corner/breathing:
    get:
      tags:
        - Care Corner
      summary: Get breathing history
      description: Get user's breathing exercise history
      operationId: getBreathingHistory
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Breathing history
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BreathingExercise'
    post:
      tags:
        - Care Corner
      summary: Record breathing exercise
      description: Record a completed breathing exercise session
      operationId: recordBreathing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - durationSeconds
              properties:
                durationSeconds:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Breathing exercise recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/BreathingExercise'

  /api/v1/care-corner/meditation:
    get:
      tags:
        - Care Corner
      summary: Get meditation history
      description: Get user's meditation session history
      operationId: getMeditationHistory
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Meditation history
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MeditationSession'
    post:
      tags:
        - Care Corner
      summary: Record meditation session
      description: Record a completed meditation session
      operationId: recordMeditation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - durationSeconds
                - soundName
              properties:
                durationSeconds:
                  type: integer
                  minimum: 1
                soundName:
                  type: string
      responses:
        '201':
          description: Meditation session recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/MeditationSession'

  /api/v1/care-corner/activities:
    get:
      tags:
        - Care Corner
      summary: Get all activities
      description: Get combined list of all care corner activities
      operationId: getAllActivities
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: All activities
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/BreathingExercise'
                        - $ref: '#/components/schemas/MeditationSession'

