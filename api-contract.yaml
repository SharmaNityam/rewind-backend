components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login/register endpoint

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        profileImageUrl:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        dateOfBirth:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum: [male, female, prefer_not_to_say]
          nullable: true
        age:
          type: integer
          nullable: true
        healthGoal:
          type: string
          nullable: true
        seekingProfessionalHelp:
          type: boolean
        pawsBalance:
          type: integer
        totalPosts:
          type: integer
        onboardingCompleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            tokens:
              type: object
              properties:
                accessToken:
                  type: string
                refreshToken:
                  type: string

    Journal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        entryType:
          type: string
          enum: [text, voice]
        voiceRecordingUrl:
          type: string
          nullable: true
        transcriptionText:
          type: string
          nullable: true
        moodTags:
          type: array
          items:
            type: string
        mediaUrls:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PenguinResponse:
      type: object
      properties:
        emotion:
          type: object
          properties:
            primary:
              type: string
              enum: [calm, neutral, low, anxious, overwhelmed, positive]
            intensity:
              type: number
              minimum: 0
              maximum: 1
            confidence:
              type: number
        penguin_state_delta:
          type: object
          properties:
            energy:
              type: integer
            mood:
              type: integer
            trust:
              type: integer
        behavior_policy:
          type: string
          enum: [SILENT_COMPANION, REFLECT, ASK_SOFT_QUESTION, CELEBRATE_SMALL_WIN, SUGGEST_GROUNDING]
        text_response:
          type: string
          nullable: true
        explainability:
          type: object
          properties:
            signals:
              type: array
              items:
                type: string
            rule_triggered:
              type: string

    Goal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        targetDate:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, completed, paused, cancelled]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DailyChallenge:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        category:
          type: string
        points:
          type: integer
        date:
          type: string
          format: date

    BreathingExercise:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        durationSeconds:
          type: integer
        durationString:
          type: string
        pawsEarned:
          type: integer
        createdAt:
          type: string
          format: date-time

    MeditationSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        durationSeconds:
          type: integer
        durationString:
          type: string
        soundName:
          type: string
        pawsEarned:
          type: integer
        createdAt:
          type: string
          format: date-time

    WellnessStats:
      type: object
      properties:
        totalBreathingMinutes:
          type: integer
        totalMeditationMinutes:
          type: integer
        challengesCompleted:
          type: integer
        totalPawsEarned:
          type: integer
        streakDays:
          type: integer

    CommunityPost:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        content:
          type: string
        isAnonymous:
          type: boolean
        tags:
          type: array
          items:
            type: string
        mediaUrls:
          type: array
          items:
            type: string
        likesCount:
          type: integer
        commentsCount:
          type: integer
        user:
          $ref: '#/components/schemas/User'
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        commentText:
          type: string
        user:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
        title:
          type: string
        message:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Pet:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        level:
          type: integer
          minimum: 1
          maximum: 10
        experience:
          type: integer
        energy:
          type: integer
          minimum: 0
          maximum: 100
        mood:
          type: integer
          minimum: 0
          maximum: 100
        trust:
          type: integer
          minimum: 0
          maximum: 100
        lastPolicy:
          type: string
          nullable: true
        customizations:
          type: object

    Pagination:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        perPage:
          type: integer
        totalPages:
          type: integer

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: string

  responses:
    BadRequest:
      description: Bad request - validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Validation failed
              details:
                - email: Valid email is required

    Unauthorized:
      description: Unauthorized - invalid or missing token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Invalid or expired token

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Resource not found

    TooManyRequests:
      description: Too many requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: TOO_MANY_REQUESTS
              message: Too many requests from this IP, please try again later.

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INTERNAL_SERVER_ERROR
              message: Internal server error
